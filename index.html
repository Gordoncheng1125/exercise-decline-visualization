<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cost of Stillness — Exercise & Aging Visualization</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  #wrapper {
    position: relative;
    width: 1920px;
    height: 1080px;
  }
  video {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    display: block;
  }
</style>
</head>
<body>
<div id="wrapper">
  <video id="bgVideo" muted playsinline>
    <source src="make-health-last.mp4" type="video/mp4">
  </video>
  <canvas id="c"></canvas>
</div>
<script>
// ─── CONFIG ───
const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const video = document.getElementById('bgVideo');
canvas.width = W;
canvas.height = H;

// Scale wrapper to fit viewport
const wrapper = document.getElementById('wrapper');
function fitCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  wrapper.style.width = (W * scale) + 'px';
  wrapper.style.height = (H * scale) + 'px';
  wrapper.style.transform = `scale(1)`;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

// ─── COLORS ───
const COL = {
  sedentary: '#ff4d6a',
  active: '#4dffb8',
  grid: 'rgba(255,255,255,0.08)',
  textDim: 'rgba(255,255,255,0.5)',
  textMid: 'rgba(255,255,255,0.75)',
  textBright: 'rgba(255,255,255,0.95)',
  white: '#ffffff',
};

// ─── DATA MODEL ───
const AGE_START = 50;
const AGE_END = 90;

// Separate starting VO2max at age 50
const VO2_SED_START = 33;
const VO2_ACT_START = 40;

// Multi-layer functional thresholds
const THRESHOLDS = [
  { vo2: 25, label: "Can't jog to catch a bus",           color: '#ffd93d', textColor: 'rgba(255,217,61,0.7)' },
  { vo2: 22, label: "Can't climb 2 flights of stairs",    color: '#ff9f1c', textColor: 'rgba(255,159,28,0.7)' },
  { vo2: 20, label: "Can't carry groceries a block",      color: '#ff6b35', textColor: 'rgba(255,107,53,0.7)' },
  { vo2: 18, label: "Can't get up from a chair unassisted", color: '#ff3333', textColor: 'rgba(255,51,51,0.7)' },
];

function vo2Sedentary(age) {
  if (age <= 50) return VO2_SED_START;
  return VO2_SED_START * Math.pow(0.82, (age - 50) / 10);
}

function vo2Active(age) {
  if (age <= 50) return VO2_ACT_START;
  return VO2_ACT_START * Math.pow(0.92, (age - 50) / 10);
}

// Find the age at which a curve crosses a threshold
function findCrossingAge(fn, threshold) {
  for (let a = 50; a <= 95; a += 0.1) {
    if (fn(a) <= threshold) return a;
  }
  return null; // never crosses
}

// Pre-compute sedentary crossing ages for each threshold
const sedCrossings = THRESHOLDS.map(th => ({
  ...th,
  crossAge: findCrossingAge(vo2Sedentary, th.vo2),
}));

// Muscle mass model — starts at 50
function muscleSedentary(age) {
  if (age <= 50) return 100;
  return 100 - ((age - 50) / 10) * 15;
}
function muscleActive(age) {
  if (age <= 50) return 100;
  return 100 - ((age - 50) / 10) * 7;
}

// ─── TIMELINE ───
// Total: ~60s to sync with video (~61s)
// Phase 0: Title card (0–4s)
// Phase 1: Chart framework + threshold lines fade in (4–8s)
// Phase 2: Curves draw age 50→65 — first threshold crossed (8–20s)
// Phase 3: Curves draw age 65→75 — second/third thresholds (20–32s)
// Phase 4: Curves draw age 75→90 — final threshold (32–42s)
// Phase 5: Stats cards (42–50s)
// Phase 6: Closing message (50–60s)

const DURATION = 60;
const VIDEO_START_OFFSET = 15; // skip first 15s of video (25–50 age content)
let frame = 0;
let startTime = null;

// ─── HELPERS ───
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function easeInOut(t) { return t < 0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

// Chart area
const CHART = {
  left: W * 0.08,
  right: W * 0.92,
  top: H * 0.22,
  bottom: H * 0.78,
};
const CHART_W = CHART.right - CHART.left;
const CHART_H = CHART.bottom - CHART.top;

function ageToX(age) {
  return CHART.left + ((age - AGE_START) / (AGE_END - AGE_START)) * CHART_W;
}
function vo2ToY(v) {
  return CHART.bottom - ((v) / 50) * CHART_H;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Text with dark shadow for readability over video
function drawText(text, x, y, opts = {}) {
  ctx.save();
  ctx.font = opts.font || '16px "Helvetica Neue", Arial';
  ctx.fillStyle = opts.color || COL.textBright;
  ctx.textAlign = opts.align || 'center';
  ctx.globalAlpha = opts.alpha !== undefined ? opts.alpha : 1;
  // Shadow for contrast against video
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 2;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ─── DRAW FUNCTIONS ───

function drawVideoOverlay(darkness) {
  ctx.fillStyle = `rgba(5,5,12,${darkness})`;
  ctx.fillRect(0, 0, W, H);
}

function drawChartBackdrop(opacity) {
  ctx.save();
  ctx.globalAlpha = opacity;
  const grad = ctx.createLinearGradient(0, CHART.top - 120, 0, CHART.bottom + 90);
  grad.addColorStop(0, 'rgba(5,5,15,0.0)');
  grad.addColorStop(0.1, 'rgba(5,5,15,0.75)');
  grad.addColorStop(0.9, 'rgba(5,5,15,0.75)');
  grad.addColorStop(1, 'rgba(5,5,15,0.0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, CHART.top - 120, W, CHART_H + 210);
  ctx.restore();
}

function drawTitle(opacity) {
  drawText('The Cost of Stillness', W/2, H/2 - 70,
    { font: 'bold 80px "Helvetica Neue", Arial', color: COL.white, alpha: opacity });
  drawText('What happens to your body after 50 without exercise', W/2, H/2 + 5,
    { font: '30px "Helvetica Neue", Arial', color: 'rgba(255,255,255,0.7)', alpha: opacity });
  drawText('Based on VO₂ Max research — the strongest predictor of lifespan', W/2, H/2 + 65,
    { font: '20px "Helvetica Neue", Arial', color: 'rgba(255,255,255,0.4)', alpha: opacity });
}

function drawChartFrame(opacity) {
  ctx.save();
  ctx.globalAlpha = opacity;

  // Chart title
  drawText('VO₂ Max Decline After 50', W/2, CHART.top - 60,
    { font: 'bold 30px "Helvetica Neue", Arial', color: COL.textBright, alpha: opacity });
  drawText('Maximum oxygen uptake — the strongest predictor of cardiovascular fitness & longevity', W/2, CHART.top - 28,
    { font: '16px "Helvetica Neue", Arial', color: COL.textDim, alpha: opacity });

  // Grid lines — VO2 axis
  ctx.strokeStyle = COL.grid;
  for (let v = 0; v <= 50; v += 10) {
    const y = vo2ToY(v);
    ctx.lineWidth = v === 0 ? 1.5 : 0.8;
    ctx.beginPath();
    ctx.moveTo(CHART.left, y);
    ctx.lineTo(CHART.right, y);
    ctx.stroke();
    drawText(v + '', CHART.left - 18, y + 5,
      { font: '13px "Helvetica Neue", Arial', color: COL.textDim, align: 'right', alpha: opacity });
  }

  // Grid lines — Age axis
  for (let a = 50; a <= 90; a += 10) {
    const x = ageToX(a);
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(x, CHART.top);
    ctx.lineTo(x, CHART.bottom);
    ctx.stroke();
    drawText(a + '', x, CHART.bottom + 24,
      { font: '13px "Helvetica Neue", Arial', color: COL.textDim, alpha: opacity });
  }

  // Y axis label
  ctx.save();
  ctx.translate(CHART.left - 55, CHART.top + CHART_H / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 6;
  ctx.fillStyle = COL.textDim;
  ctx.globalAlpha = opacity;
  ctx.font = '14px "Helvetica Neue", Arial';
  ctx.textAlign = 'center';
  ctx.fillText('VO₂ Max (ml/kg/min)', 0, 0);
  ctx.restore();

  drawText('Age (years)', W / 2, CHART.bottom + 50,
    { font: '14px "Helvetica Neue", Arial', color: COL.textDim, alpha: opacity });

  // Axes
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(CHART.left, CHART.top);
  ctx.lineTo(CHART.left, CHART.bottom);
  ctx.lineTo(CHART.right, CHART.bottom);
  ctx.stroke();

  ctx.restore();
}

function drawThresholdLines(opacity) {
  THRESHOLDS.forEach(th => {
    const y = vo2ToY(th.vo2);

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.setLineDash([10, 6]);
    ctx.strokeStyle = th.color;
    ctx.lineWidth = 1.8;
    ctx.shadowColor = th.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(CHART.left, y);
    ctx.lineTo(CHART.right, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Right-side label
    drawText(th.vo2 + ' — ' + th.label, CHART.right - 10, y - 10,
      { font: '13px "Helvetica Neue", Arial', color: th.textColor, align: 'right', alpha: opacity });
  });
}

function drawCurve(fn, color, maxAge, glow) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = glow || 15;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  let started = false;
  for (let a = AGE_START; a <= maxAge; a += 0.5) {
    const x = ageToX(a);
    const y = vo2ToY(fn(a));
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Bright dot at end
  if (maxAge > AGE_START + 1) {
    const ex = ageToX(maxAge), ey = vo2ToY(fn(maxAge));
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.arc(ex, ey, 6, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    // Outer pulse
    ctx.globalAlpha = 0.3 + 0.15 * Math.sin(frame * 0.06);
    ctx.beginPath();
    ctx.arc(ex, ey, 14, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Area fill under curve for visual weight
function drawCurveArea(fn, color, maxAge, opacity) {
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.beginPath();
  ctx.moveTo(ageToX(AGE_START), CHART.bottom);
  for (let a = AGE_START; a <= maxAge; a += 0.5) {
    ctx.lineTo(ageToX(a), vo2ToY(fn(a)));
  }
  ctx.lineTo(ageToX(maxAge), CHART.bottom);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, CHART.top, 0, CHART.bottom);
  grad.addColorStop(0, color.replace(')', ',0.15)').replace('rgb', 'rgba'));
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();
}

function drawAgeCounter(age, opacity) {
  drawText('AGE', W - 120, CHART.top - 50,
    { font: '16px "Helvetica Neue", Arial', color: COL.textDim, alpha: opacity });
  drawText(Math.floor(age) + '', W - 120, CHART.top + 5,
    { font: 'bold 60px "Helvetica Neue", Arial', color: COL.white, alpha: opacity });
}

function drawLegend(opacity) {
  const lx = CHART.left + 20;
  const ly = CHART.top + 18;

  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 6;

  // Sedentary
  ctx.fillStyle = COL.sedentary;
  ctx.beginPath(); ctx.arc(lx, ly, 7, 0, Math.PI * 2); ctx.fill();
  drawText('Sedentary — no regular exercise', lx + 20, ly + 5,
    { font: '14px "Helvetica Neue", Arial', color: COL.sedentary, align: 'left', alpha: opacity });

  // Active
  ctx.fillStyle = COL.active;
  ctx.beginPath(); ctx.arc(lx, ly + 28, 7, 0, Math.PI * 2); ctx.fill();
  drawText('Lightly Active — 15–30 min/day, most days', lx + 20, ly + 33,
    { font: '14px "Helvetica Neue", Arial', color: COL.active, align: 'left', alpha: opacity });

  ctx.restore();
}

// Visual event when sedentary curve hits a threshold
function drawThresholdCrossingEvent(crossing, currentAge, opacity) {
  if (!crossing.crossAge || currentAge < crossing.crossAge) return;

  const x = ageToX(crossing.crossAge);
  const y = vo2ToY(crossing.vo2);
  const fade = easeOut(clamp((currentAge - crossing.crossAge) / 2, 0, 1));
  const combinedAlpha = fade * opacity;

  ctx.save();
  ctx.globalAlpha = combinedAlpha;
  const pulse = 1 + 0.2 * Math.sin(frame * 0.07);

  // Pulsing ring
  ctx.strokeStyle = crossing.color;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = crossing.color;
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(x, y, 12 * pulse, 0, Math.PI * 2);
  ctx.stroke();

  // Inner fill
  ctx.globalAlpha = combinedAlpha * 0.4;
  ctx.fillStyle = crossing.color;
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Label above the crossing point
  drawText(crossing.label, x, y - 28,
    { font: 'bold 15px "Helvetica Neue", Arial', color: crossing.color, alpha: combinedAlpha });
  drawText('Age ' + Math.round(crossing.crossAge), x, y - 10,
    { font: '13px "Helvetica Neue", Arial', color: 'rgba(255,255,255,0.7)', alpha: combinedAlpha });
}

// Highlight threshold label when crossed
function drawThresholdHighlight(crossing, currentAge) {
  if (!crossing.crossAge || currentAge < crossing.crossAge) return;

  const y = vo2ToY(crossing.vo2);
  const fade = easeOut(clamp((currentAge - crossing.crossAge) / 2, 0, 1));

  // Bright flash on the threshold line text
  const flashIntensity = Math.max(0, 1 - (currentAge - crossing.crossAge) / 4);
  if (flashIntensity > 0) {
    drawText(crossing.vo2 + ' — ' + crossing.label, CHART.right - 10, y - 10,
      { font: 'bold 14px "Helvetica Neue", Arial', color: crossing.color, align: 'right', alpha: flashIntensity * 0.8 });
  }
}

function drawMuscleBar(x, w, pct, color, label, opacity) {
  ctx.save();
  ctx.globalAlpha = opacity;
  const barH = 16;
  const y = CHART.bottom + 75;

  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  roundRect(ctx, x, y, w, barH, 4); ctx.fill();

  ctx.fillStyle = color;
  ctx.globalAlpha = opacity * 0.75;
  roundRect(ctx, x, y, w * (pct / 100), barH, 4); ctx.fill();
  ctx.restore();

  drawText(label + ': ' + Math.round(pct) + '%', x, y - 8,
    { font: '12px "Helvetica Neue", Arial', color: COL.textDim, align: 'left', alpha: opacity });
}

function drawStats(opacity) {
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.fillStyle = `rgba(5,5,12,0.88)`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  drawText('The Numbers Don\'t Lie', W/2, 155,
    { font: 'bold 46px "Helvetica Neue", Arial', color: COL.textBright, alpha: opacity });

  // Find when sedentary crosses the worst threshold (18)
  const sedChairAge = sedCrossings[3].crossAge;
  // Active never crosses any threshold — show "90+" or "Never"
  const actNeverCrosses = findCrossingAge(vo2Active, 25); // even the mildest threshold

  const stats = [
    { value: Math.round(sedChairAge), unit: 'years old', label: 'Sedentary can\'t get up from a chair', color: COL.sedentary },
    { value: '90+', unit: '', label: 'Active stays above all thresholds', color: COL.active },
    { value: '4×', unit: 'mortality risk', label: 'Low fitness vs. high fitness', color: '#ff9f1c' },
    { value: '15–30', unit: 'min / day', label: 'Is all it takes', color: '#8b9fff' },
  ];

  const cardW = 380, cardH = 190, gap = 40;
  const sx = W/2 - cardW - gap/2, sy = 210;

  stats.forEach((s, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const x = sx + col * (cardW + gap);
    const y = sy + row * (cardH + gap);

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    roundRect(ctx, x, y, cardW, cardH, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    roundRect(ctx, x, y, cardW, cardH, 14); ctx.stroke();
    ctx.restore();

    drawText(s.value + '', x + cardW/2, y + 90,
      { font: 'bold 68px "Helvetica Neue", Arial', color: s.color, alpha: opacity });
    drawText(s.unit, x + cardW/2, y + 122,
      { font: '22px "Helvetica Neue", Arial', color: 'rgba(255,255,255,0.45)', alpha: opacity });
    drawText(s.label, x + cardW/2, y + 158,
      { font: '18px "Helvetica Neue", Arial', color: COL.textMid, alpha: opacity });
  });

  drawText('Data modeled from: JAMA Network Open 2018 (122,007 adults) · ACSM/FRIEND Registry · EWGSOP2 guidelines', W/2, H - 70,
    { font: '14px "Helvetica Neue", Arial', color: COL.textDim, alpha: opacity });
  drawText('Decline curves are illustrative models based on published rates, not raw study data.', W/2, H - 48,
    { font: '12px "Helvetica Neue", Arial', color: 'rgba(255,255,255,0.3)', alpha: opacity });
}

function drawClosing(opacity) {
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.fillStyle = `rgba(5,5,12,0.85)`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  drawText('You don\'t need to be an athlete.', W/2, H/2 - 80,
    { font: 'bold 58px "Helvetica Neue", Arial', color: COL.active, alpha: opacity });
  drawText('You just need to move a little, most days.', W/2, H/2,
    { font: '38px "Helvetica Neue", Arial', color: COL.textBright, alpha: opacity });
  drawText('15 minutes of walking  ·  A few flights of stairs  ·  A short stretch', W/2, H/2 + 70,
    { font: '22px "Helvetica Neue", Arial', color: COL.textDim, alpha: opacity });
  drawText('The difference between dependence and independence.', W/2, H/2 + 150,
    { font: 'bold 30px "Helvetica Neue", Arial', color: '#ff9f1c', alpha: opacity });
}

// ─── MAIN RENDER ───
function render(t) {
  // Clear canvas (transparent — lets video show through)
  ctx.clearRect(0, 0, W, H);

  // Phase 0: Title (0–4s) — heavy overlay, video barely visible
  if (t < 4) {
    const overlayDark = lerp(0.5, 0.1, clamp(t / 4, 0, 1));
    drawVideoOverlay(overlayDark);
    const fadeIn = easeOut(clamp(t / 1.5, 0, 1));
    const fadeOut = t > 2.5 ? clamp((4 - t) / 1.5, 0, 1) : 1;
    drawTitle(fadeIn * fadeOut);
    return;
  }

  // Phase 1+: Chart visible — video shows through with moderate overlay
  drawVideoOverlay(0.1);

  // Chart backdrop (frosted panel)
  const chartFade = easeOut(clamp((t - 4) / 2, 0, 1));
  drawChartBackdrop(chartFade);
  drawChartFrame(chartFade);
  drawLegend(chartFade);

  // Phase 1: Threshold lines fade in (4–8s)
  if (t >= 4) {
    const thFade = easeOut(clamp((t - 5) / 2, 0, 1));
    drawThresholdLines(thFade * chartFade);
  }

  if (t < 8) return;

  // Phase 2–4: Curves (8–42s)
  // Map time 8–42s to age 50–90 with easing
  const curveStartT = 8;
  const curveEndT = 42;
  const curveProgress = clamp((t - curveStartT) / (curveEndT - curveStartT), 0, 1);
  const currentAge = AGE_START + (AGE_END - AGE_START) * easeInOut(curveProgress);

  // Filled areas under curves
  drawCurveArea(vo2Active, 'rgb(77,255,184)', currentAge, 0.08);
  drawCurveArea(vo2Sedentary, 'rgb(255,77,106)', currentAge, 0.06);

  // Curves
  drawCurve(vo2Sedentary, COL.sedentary, currentAge, 15);
  drawCurve(vo2Active, COL.active, currentAge, 15);

  // Age counter
  if (t >= 8 && t < 42) {
    drawAgeCounter(currentAge, 1);
  }

  // Threshold lines (keep visible during curve drawing)
  drawThresholdLines(1);

  // Threshold crossing events
  sedCrossings.forEach(crossing => {
    drawThresholdCrossingEvent(crossing, currentAge, 1);
    drawThresholdHighlight(crossing, currentAge);
  });

  // Muscle bars — start from age 50
  if (currentAge > 52) {
    const barFade = clamp((currentAge - 52) / 5, 0, 1);
    const barW = (CHART_W / 2) - 50;
    drawMuscleBar(CHART.left, barW, muscleSedentary(currentAge), COL.sedentary, 'Muscle Mass — Sedentary', barFade);
    drawMuscleBar(CHART.left + barW + 100, barW, muscleActive(currentAge), COL.active, 'Muscle Mass — Active', barFade);
  }

  // Phase 5: Stats (42–50s)
  if (t >= 42 && t < 50) {
    const sFade = easeOut(clamp((t - 42) / 1.5, 0, 1));
    const sOut = t > 48 ? clamp((50 - t) / 2, 0, 1) : 1;
    drawStats(sFade * sOut);
  }

  // Phase 6: Closing (50–60s)
  if (t >= 50) {
    drawClosing(easeOut(clamp((t - 50) / 2, 0, 1)));
  }
}

// ─── ANIMATION LOOP ───
function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  const t = (timestamp - startTime) / 1000;
  frame++;

  if (t <= DURATION + 2) {
    render(Math.min(t, DURATION));
    requestAnimationFrame(animate);
  } else {
    render(DURATION);
  }
}

// Start: play video (with offset) and begin animation simultaneously
video.addEventListener('canplay', function onReady() {
  video.removeEventListener('canplay', onReady);
  video.currentTime = VIDEO_START_OFFSET;
  video.play();
  requestAnimationFrame(animate);
}, { once: true });

// Fallback if already loaded
if (video.readyState >= 3) {
  video.currentTime = VIDEO_START_OFFSET;
  video.play();
  setTimeout(() => requestAnimationFrame(animate), 100);
}

video.load();
</script>
